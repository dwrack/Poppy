name: Deploy version 2 preview to GitHub Pages (/v2/)

# Manual only until version 2 has something to show. Version 1 deploys
# from the v1 branch to the site root and is never touched from here.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
        env:
          BASE_PATH: /Poppy/v2/
      - run: touch app/dist/.nojekyll && cp app/dist/index.html app/dist/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: app/dist
          publish_branch: gh-pages
          destination_dir: v2
          keep_files: true
